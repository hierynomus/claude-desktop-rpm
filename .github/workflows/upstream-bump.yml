name: upstream version bump

# Checks Anthropic's apt index for a newer claude-desktop and, if there is
# one, opens a PR that bumps packaging/ and turns on auto-merge. OBS
# test-builds the PR; when the "OBS: claude-desktop ..." check goes green
# the PR merges itself, and the push to main triggers the real rebuild.
#
# Auto-merge is inert until, in repo Settings: (a) "Allow auto-merge" is on,
# and (b) a branch ruleset on main requires the status check
# "OBS: claude-desktop - openSUSE_Leap_16.0/x86_64" (not the
# "OBS SCM/CI Workflow Integration" check - that one goes green on dispatch,
# before the build runs). No required reviews, or a solo bot PR never merges.
#
# No OBS credentials are needed here: the checksum comes from the apt index.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Pin a specific version (default: newest in the index)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bump script
        id: bump
        run: |
          set -euo pipefail
          out=$(scripts/bump-version.sh ${{ inputs.version }})
          echo "$out"
          if echo "$out" | grep -q '^bumped '; then
            new=$(echo "$out" | sed -n 's/^bumped .* -> //p')
            echo "changed=true"     >> "$GITHUB_OUTPUT"
            echo "version=$new"     >> "$GITHUB_OUTPUT"
          else
            echo "changed=false"    >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        id: cpr
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bump/claude-desktop-${{ steps.bump.outputs.version }}
          commit-message: "claude-desktop ${{ steps.bump.outputs.version }}: update to upstream release"
          title: "claude-desktop ${{ steps.bump.outputs.version }}"
          body: |
            Automated bump from Anthropic's apt index.

            - `Version` and `%global deb_sha256` updated in `packaging/claude-desktop.spec`
            - `download_url` URL updated in `packaging/_service`
            - SHA256 is verified in `%prep` at build time

            OBS test-builds this in a scratch project; merges on green.
          labels: automated, upstream-bump

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: |
          gh pr merge --auto --squash "$PR" \
            || echo "::warning::could not enable auto-merge - is 'Allow auto-merge' on and a required check set? merge PR #$PR by hand."
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
