# OBS SCM/CI workflow integration.
# https://openbuildservice.org/help/manuals/obs-user-guide/cha.obs.scm_ci_workflow_integration.html
#
# One-time setup (see docs/obs-setup.md):
#   - home:hierynomus/claude-desktop has <scmsync> pointing at this repo
#   - an OBS workflow token exists (osc token --create --operation workflow
#     --scm-token <github-PAT>)
#   - a GitHub webhook posts to
#     https://build.opensuse.org/trigger/workflow?id=<token-id>
#   - target project home:hierynomus:ci exists (branch target for PRs)
#
# Push to main: re-run source services on the package. For an scmsync
# package this makes obs-scm-bridge re-pull git and OBS rebuild - the same
# thing `osc service remoterun home:hierynomus claude-desktop` does. Without
# this, a push matches no workflow and the scmsync mirror never updates.
sync_main:
  steps:
    - trigger_services:
        project: home:hierynomus
        package: claude-desktop
  filters:
    event: push
    branches:
      only:
        - main

pull_request:
  steps:
    - branch_package:
        source_project: home:hierynomus
        source_package: claude-desktop
        target_project: home:hierynomus:ci
  filters:
    event: pull_request
