# OBS SCM/CI workflow integration - PR builds only.
# https://openbuildservice.org/help/manuals/obs-user-guide/cha.obs.scm_ci_workflow_integration.html
#
# Pushes to main are handled outside this file, by a runservice token +
# /trigger/webhook (see docs/obs-setup.md). This file is reached only by the
# workflow token + /trigger/workflow, wired to pull_request events.
#
# On a PR, branch the package into a scratch project pinned to the PR head,
# build it (publishing disabled), and report status back to the PR. OBS
# deletes the scratch project when the PR closes.

pull_request:
  steps:
    - branch_package:
        source_project: home:hierynomus
        source_package: claude-desktop
        target_project: home:hierynomus:ci
  filters:
    event: pull_request
